<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第一年的冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 莫蘭迪雙人對戰：上方兩位玩家與骰子、中間 7×8 愛心棋盤、下方行動列與手牌；特效浮在最上層 */
:root{
  color-scheme:light;
  --bg:#E4E0D8;--surface:#EFEBE5;--card:#F7F4EF;--ink:#4A4E58;--soft:#80838B;--line:#D3CCC2;
  --him:#8FA3B8;--him-soft:#D3DCE5;--her:#C99A93;--her-soft:#EDD9D4;
  --stone:#ABA49B;--gold:#C9AE6A;--gold-soft:#EADFBF;--night:#5B6374;--sel:#D9C48F;--warn:#9C6F69;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-weight:normal;margin:0;text-wrap:balance}
.screen{display:none;flex-direction:column;align-items:center;min-height:100%;padding-block:16px 28px;padding-inline:16px;position:relative;z-index:1}
.screen.on{display:flex}
.btn{font-size:16px;border:0;border-radius:999px;padding:12px 24px;background:var(--ink);color:var(--card);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:10px 16px;font-size:15px}
#game .actions .btn{padding:9px 16px;font-size:15px}
.btn.warn{background:var(--warn)}
.btn.goldb{background:var(--gold);color:#3F3A2E}
.muted{color:var(--soft);font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}

/* ambient floating hearts */
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#ambient i{position:absolute;bottom:-40px;width:18px;height:18px;opacity:.0;animation:floatUp linear infinite}
#ambient svg{width:100%;height:100%}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.35}90%{opacity:.25}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx .p{position:absolute;left:0;top:0;will-change:transform,opacity}

/* intro */
#intro{justify-content:center;text-align:center;gap:16px;min-height:100vh;min-height:100dvh}
#intro h1{font-family:var(--serif);font-weight:700;font-size:44px;letter-spacing:.14em}
#intro .bob{animation:bob 2.4s ease-in-out infinite}
#intro .bob:nth-child(2){animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-8px)}}
#pass{font-family:inherit;font-size:28px;letter-spacing:.5em;text-align:center;width:180px;padding:10px 0 10px .5em;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}

/* game */
#game{gap:6px;height:100%;min-height:0;overflow:hidden;padding-block:8px 10px}
#game > *{flex:none}
#game .boardwrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.topline{width:min(100%,460px);display:flex;gap:8px;align-items:center}
.topline .banner{flex:1;width:auto}
.rulesmini{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.players{width:min(100%,460px);display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.player{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px;border-radius:18px;border:2px solid transparent;transition:background .3s,border-color .3s,transform .3s;min-width:0}
.player.active{background:var(--card);border-color:var(--pc);transform:scale(1.04)}
.player.active .av{animation:bob 1.6s ease-in-out infinite}
.player .nm{font-size:14px;font-weight:bold;line-height:1.3}
.player .st{font-size:11px;color:var(--soft);line-height:1.3}
.player .say{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1.6;margin-top:2px}
.player .say.new{animation:sayPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes sayPop{from{transform:scale(.3) translateY(6px);opacity:0}}
.egg .flip .front{background:linear-gradient(135deg,#C9AE6A,#E9D9A6);color:#4A4E58}
.egg .flip{width:220px;height:150px}
.egg .flip .back{font-size:15px;line-height:1.6;padding:14px}
.player .st{font-size:12px;line-height:1.4;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.player .tag{font-size:11px;border-radius:999px;padding:0 8px;background:var(--pcs);min-height:16px;line-height:16px;white-space:nowrap}
.player .tag:empty{background:transparent}
.p0{--pc:var(--him);--pcs:var(--him-soft)}
.p1{--pc:var(--her);--pcs:var(--her-soft)}
.diebox{display:flex;flex-direction:column;align-items:center;gap:4px}
.dice{display:flex;gap:6px}
.die{width:50px;height:50px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;gap:2px;box-shadow:0 3px 0 var(--line)}
.die i{display:block;width:9px;height:9px;border-radius:50%;place-self:center}
.die i.on{background:var(--ink)}
.die.gold{border-color:var(--gold);background:var(--gold-soft)}
.diebox .round{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.banner{width:min(100%,460px);text-align:center;font-size:15px;background:var(--pcs);border-radius:999px;padding:4px 14px;transition:background .4s}
.banner b{font-family:var(--serif)}
.boardwrap{position:relative;width:min(100%,460px)}
.board{width:100%}
.board{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:5px;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--surface);padding:7px;border-radius:18px}
.cell{aspect-ratio:1;border-radius:10px;border:0;padding:0;background:var(--card);display:grid;place-items:center;transition:background .25s,transform .15s;position:relative}
.cell svg{width:60%;height:60%;pointer-events:none}
.cell .h{fill:none;stroke:var(--line);stroke-width:2}
.cell .stn{display:none}
.cell.o0{background:var(--him)}.cell.o1{background:var(--her)}
.cell.o0 .h,.cell.o1 .h{fill:#F7F4EF;stroke:none;opacity:.92}
.cell.stone{background:var(--surface)}
.cell.stone .h{display:none}
.cell.stone .stn{display:block}
.cell.stone .mood{display:none}
.cell.stone.grumpy .mood{display:inline}
.cell.sel{background:var(--sel);transform:scale(.9)}
.cell.sel .h{fill:#F7F4EF;stroke:none}
.cell.tgt{box-shadow:inset 0 0 0 3px var(--warn)}
.cell.marked{background:var(--warn)}
.cell.marked .h{fill:#F7F4EF;stroke:none}
.cell.hover:not(.stone):not(.o0):not(.o1){background:#EFE7D2}
.actions{width:min(100%,460px);display:flex;align-items:center;justify-content:space-between;gap:8px}
.count{text-align:center;font-size:15px;font-variant-numeric:tabular-nums;flex:1;min-width:0}
.count b{font-size:20px}
.count small{display:block;font-size:11px;color:var(--soft);line-height:1.3}
.hand{width:min(100%,460px);display:flex;gap:6px;overflow-x:auto;padding:4px 2px 4px}
.hand .lbl{font-size:13px;color:var(--soft);align-self:center;writing-mode:vertical-rl;flex:none}
.hcard{flex:none;width:80px;min-height:96px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;font-size:13px;text-align:center;transition:transform .2s,opacity .2s;position:relative}
.hcard:not(:disabled):hover{transform:translateY(-4px)}
.hcard:disabled{opacity:.45;cursor:default}
.hcard .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:#3F434C}
.hcard .v{position:absolute;top:4px;right:6px;font-size:13px;font-weight:bold}
.hcard small{font-size:10px;color:var(--soft);line-height:1.25}
.hcard b{font-size:12px;line-height:1.2}
.hcard.empty{border-style:dashed;color:var(--soft);cursor:default}
.hcard.new{animation:deal .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes deal{from{transform:translateY(60px) rotate(-12deg) scale(.6);opacity:0}}
.helpline{font-size:13px;color:var(--soft);text-align:center;min-height:20px;line-height:1.5}
.helpline button{border:0;background:var(--warn);color:var(--card);border-radius:999px;padding:2px 12px;font-size:13px;margin-left:6px}

/* center pop text */
#pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:25;pointer-events:none;text-align:center;opacity:0}
#pop .big{font-family:var(--serif);font-weight:700;font-size:96px;line-height:1;color:var(--ink);text-shadow:0 4px 0 var(--card)}
#pop .sub{font-size:18px;background:var(--card);border-radius:999px;padding:4px 16px;display:inline-block;margin-top:6px}
#turnCard{position:fixed;left:0;right:0;top:36%;z-index:24;pointer-events:none;display:flex;justify-content:center;opacity:0}
#turnCard > div{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:12px 26px 12px 16px;border:3px solid var(--pc);box-shadow:0 8px 0 var(--pcs)}
#turnCard b{font-family:var(--serif);font-size:26px}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(60,62,70,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.on{display:flex}
.panel{background:var(--surface);width:min(100%,480px);border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;text-align:center;animation:up .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.panel h3{font-family:var(--serif);font-weight:700;font-size:23px;margin-bottom:6px}
.panel p{margin:8px 0}
.panel .btn{margin-top:12px}
.qcard{background:var(--card);border:1.5px dashed var(--gold);border-radius:16px;padding:22px 18px;margin:10px 0;font-size:20px;line-height:1.6;animation:wiggle .8s ease}
@keyframes wiggle{20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1deg)}80%{transform:rotate(1deg)}}
.evart{display:flex;justify-content:center;margin:6px 0}
.evart svg{animation:bob 1.4s ease-in-out infinite}
.rules{text-align:left;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.rules div{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:9px 12px;font-size:14px}
.rules .n{font-family:var(--serif);font-size:18px;text-align:center;font-weight:bold}
.rules .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#3F434C}
.draws{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.flip{width:132px;height:184px;perspective:800px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip:not(.open) .in{animation:hover 1.8s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px)}}
.flip .fa{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border:5px solid var(--pc);overflow:hidden}
.flip .front{background:var(--night);color:#F1E9D6;font-family:var(--serif);font-size:20px}
.flip .front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);animation:shine 2.2s infinite}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.flip .back{background:var(--card);transform:rotateY(180deg);font-size:13px}
.flip .back b{font-size:16px}
.flip .back .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:#3F434C}

/* slot */
.slot{background:var(--night);border-radius:22px;padding:14px;margin:10px auto;width:max-content;max-width:100%;position:relative}
.slot.win{animation:glow 1s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--gold),0 0 40px 10px rgba(201,174,106,.7)}}
.reels{display:flex;gap:8px}
.reel{width:76px;height:84px;border-radius:12px;background:#EEE7DA;overflow:hidden;position:relative}
.reel .strip{position:absolute;left:0;right:0;top:0}
.reel .sy{height:84px;display:grid;place-items:center}
.reel.tense{box-shadow:0 0 0 3px var(--gold)}
.sym{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#3F434C;position:relative}
.sym svg{width:62%;height:62%}
.sym.sc{background:radial-gradient(circle at 35% 30%,#F3E3B0,#C9AE6A 70%);box-shadow:0 0 0 2px #E9D9A6}
.sym.sc small{position:absolute;bottom:-2px;right:-4px;font-size:10px;background:#5B6374;color:#F3E3B0;border-radius:6px;padding:0 4px}
.whose{display:inline-flex;align-items:center;gap:8px;background:var(--pcs);border-radius:999px;padding:4px 14px 4px 6px;font-weight:bold}

/* ending */
#win,#letter,#card{gap:18px;text-align:center;justify-content:center}
#win h2{font-family:var(--serif);font-weight:700;font-size:32px}
#win .winart svg:first-child{animation:jump 1s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(-22px) rotate(6deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,400px)}
.stats div{background:var(--card);border-radius:14px;padding:10px 6px;font-size:13px;color:var(--soft)}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
#letter .paper{width:min(100%,440px);background:var(--card);border-radius:6px;padding:30px 26px;text-align:left;font-family:var(--serif);font-size:17px;line-height:2}
#letter .paper p{margin:0 0 1em;animation:ink .8s ease both}
@keyframes ink{from{opacity:0;transform:translateY(8px)}}
#letter .sign{text-align:right}
#pc{width:min(100%,520px);border-radius:8px;display:block}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:var(--ink);color:var(--card);border-radius:999px;padding:8px 18px;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ===== polish: weather moods, depth, tint ===== */
body{transition:background-color 1s ease}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
#sky .t0{background:radial-gradient(120% 60% at 15% 0%,rgba(143,163,184,.28),transparent 60%)}
#sky .t1{background:radial-gradient(120% 60% at 85% 0%,rgba(201,154,147,.28),transparent 60%)}
#sky .storm{background:linear-gradient(180deg,rgba(92,98,112,.55),rgba(120,124,134,.25) 45%,rgba(140,142,150,.15));}
#sky .gold{background:radial-gradient(80% 60% at 50% 45%,rgba(233,217,166,.55),transparent 70%)}
#sky .windy{background:linear-gradient(100deg,transparent 20%,rgba(163,180,196,.22) 50%,transparent 80%);background-size:200% 100%;animation:breeze 2.4s linear infinite}
@keyframes breeze{from{background-position:100% 0}to{background-position:-100% 0}}
body[data-turn="0"] #sky .t0, body[data-turn="1"] #sky .t1{opacity:1}
body[data-mood="storm"] #sky .storm, body[data-mood="gold"] #sky .gold, body[data-mood="wind"] #sky .windy{opacity:1}
body[data-mood="storm"] #sky .t0, body[data-mood="storm"] #sky .t1{opacity:0}
body[data-mood="storm"]{--bg:#C4C6CB;--surface:#D0D1D5;--card:#E0E0E3;--line:#B9BBC1;--him-soft:#C7CED6;--her-soft:#D6CACA}
body[data-mood="storm"] .board{filter:saturate(.55) brightness(.94)}
body[data-mood="storm"] #ambient{filter:grayscale(1);opacity:.5}
body[data-mood="storm"] .player,body[data-mood="storm"] .banner{filter:saturate(.6)}
#sky .clouds{opacity:0;transition:opacity 1.2s}
body[data-mood="storm"] #sky .clouds{opacity:1}
#sky .clouds svg{position:absolute;top:2%;width:46vw;max-width:260px;animation:drift 14s linear infinite}
#sky .clouds svg:nth-child(2){top:9%;width:34vw;animation-duration:19s;animation-delay:-7s}
#sky .clouds svg:nth-child(3){top:0;width:28vw;animation-duration:24s;animation-delay:-15s}
@keyframes drift{from{transform:translateX(-50vw)}to{transform:translateX(110vw)}}
body[data-mood="wind"] .board{animation:sway 1.2s ease-in-out infinite}
@keyframes sway{50%{transform:skewX(-1.2deg) translateX(2px)}}
.board{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 14px 30px -20px rgba(74,78,88,.55);transition:filter 1s ease,background-color 1s ease}
.cell{box-shadow:inset 0 -2px 0 rgba(74,78,88,.06)}
.cell.o0,.cell.o1{box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.12)}
.cell.stone .stn{filter:drop-shadow(0 2px 1px rgba(74,78,88,.25))}
.cell.sel{box-shadow:0 0 0 2px #F7F4EF,0 0 14px 2px rgba(217,196,143,.75);animation:selGlow 1.2s ease-in-out infinite}
@keyframes selGlow{50%{box-shadow:0 0 0 2px #F7F4EF,0 0 20px 5px rgba(217,196,143,.95)}}
.die{background:linear-gradient(160deg,#FFFDF9,#ECE7DF);box-shadow:0 3px 0 var(--line),0 8px 14px -8px rgba(74,78,88,.45)}
.die i.on{box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.die.gold{background:linear-gradient(160deg,#F8EFD3,#E3D19C)}
.btn{box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s,box-shadow .12s,opacity .2s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{box-shadow:0 2px 0 var(--line)}
.btn:disabled{box-shadow:none}
.player.active{box-shadow:0 0 0 4px var(--pcs),0 10px 20px -14px rgba(74,78,88,.5)}
.banner{box-shadow:inset 0 -2px 0 rgba(74,78,88,.06)}
.hcard{box-shadow:0 2px 0 var(--line);overflow:hidden}
.hcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--cc,var(--line))}
.overlay{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel{position:relative;box-shadow:0 -10px 30px -16px rgba(74,78,88,.5)}
.panel::before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--line);margin:-10px auto 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="sky" aria-hidden="true"><i class="t0"></i><i class="t1"></i><i class="windy"></i><i class="gold"></i><i class="storm"></i><i class="clouds"><svg viewBox="0 0 120 50"><path d="M18 44c-12 0-16-14-6-19c-2-12 12-18 21-11c5-11 22-13 29-3c9-6 24 0 23 12c12 1 15 17 3 21z" fill="#7E838F" opacity=".55"/></svg><svg viewBox="0 0 120 50"><path d="M18 44c-12 0-16-14-6-19c-2-12 12-18 21-11c5-11 22-13 29-3c9-6 24 0 23 12c12 1 15 17 3 21z" fill="#7E838F" opacity=".55"/></svg><svg viewBox="0 0 120 50"><path d="M18 44c-12 0-16-14-6-19c-2-12 12-18 21-11c5-11 22-13 29-3c9-6 24 0 23 12c12 1 15 17 3 21z" fill="#7E838F" opacity=".55"/></svg></i></div>
<div id="ambient" aria-hidden="true"></div>

<section class="screen on" id="intro">
  <div id="introArt"></div>
  <h1>愛心圈圈</h1>
  <p class="muted" id="passHint"></p>
  <input id="pass" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="通關密碼">
  <button class="btn" id="go">進入遊戲</button>
  <p class="muted" id="passErr" aria-live="polite"></p>
</section>

<section class="screen" id="game">
  <div class="players">
    <div class="player p0" id="pl0"></div>
    <div class="diebox"><div class="dice"><div class="die" id="die"></div><div class="die gold" id="die2" hidden></div></div><span class="round" id="round"></span></div>

}

/* ---------- FX ---------- */
const fx = $("#fx");
function centerOf(el){ const r = el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function particle(html, x, y, size){ const p = document.createElement("div"); p.className = "p"; p.style.width = p.style.height = size+"px"; p.innerHTML = html; p.style.transform = `translate(${x-size/2}px,${y-size/2}px)`; fx.appendChild(p); return p; }
function burst(x, y, {n=12, colors=["#C99A93","#8FA3B8","#D9CBA6"], spread=90, size=16, dur=900, up=0}={}){
  if (REDUCED) return;
  for (let k=0;k<n;k++){
    const p = particle(heartSVG(pick(colors)), x, y, size*(.6+Math.random()*.7));
    const a = Math.random()*Math.PI*2, d = spread*(.4+Math.random()*.8);

  }
}
function confetti(n=60){
  if (REDUCED) return;

  G.hands[0].push(drawCard()); G.hands[1].push(drawCard());

function drawCard(){ const deck = G && G.expandSeen ? DECK.filter(k=>k!=="expand") : DECK; const k = pick(deck), c = CARDS[k]; if (k==="expand" && G) G.expandSeen = true; return {k, v: c.vals ? pick(c.vals) : 0}; }
const neighbors = i => { const r = Math.floor(i/COLS), c = i%COLS, n = []; if (r>0) n.push(i-COLS); if (r<ROWS-1) n.push(i+COLS); if (c>0) n.push(i-1); if (c<COLS-1) n.push(i+1); return n; };
function maxFreeComponent(){
  const seen = new Uint8Array(N); let best = 0;
  for (let i=0;i<N;i++){ if (seen[i] || G.cells[i].o!==null) continue; let size = 0; const st = [i]; seen[i] = 1;
    while (st.length){ const j = st.pop(); size++; for (const k of neighbors(j)) if (!seen[k] && G.cells[k].o===null){ seen[k]=1; st.push(k); } }
    best = Math.max(best, size); }
  return best;
}

}

function canUse(card){

}

/* ---------- random events ---------- */
async function randomEvents(){
  let events = 0;
  const stoneChance = G.turns<2 ? 0 : Math.min(.4, .08 + G.sinceStone*.05);
  if (Math.random()<stoneChance){ G.sinceStone = 0; await grumpyStones(); events++; }
  const placed = ownedIdx(0).length + ownedIdx(1).length;
  const windChance = G.turns<3 || placed<3 ? 0 : Math.min(.55, .12 + G.sinceWind*.07);
  if (events<2 && Math.random()<windChance){ G.sinceWind = 0; await naughtyWind(); events++; }
  const qChance = G.sinceQ>=5 ? 1 : G.sinceQ>=3 ? .45 : 0;
  if (events<2 && Math.random()<qChance){ G.sinceQ = 0; await questionTime(); }
}

async function grumpyStones(){

      const a = from[k], b = targets[k], ea = cellEl(a), eb = cellEl(b);

  return `<h3>遊戲規則</h3><div class="rules">
    <div><span class="n">1</span><span>輪流擲骰子，骰到幾點就圈幾顆上下左右相連的空愛心。</span></div>
    <div><span class="n">2</span><span>輪到你時找不到能連著圈的空位就輸了。石頭不能圈。</span></div>
    <div><span class="n">3</span><span>有人不開心時，天上會掉石頭，或把石頭踢到別的地方。</span></div>
    <div><span class="n">4</span><span>調皮風會隨機吹走最多 4 顆愛心，可能只吹一個人，也可能兩個人都吹。</span></div>
    <div><span class="n">5</span><span>問答時間兩人都回答後，會各抽一張卡，或由兩人輪流其中一人拉霸。拉霸轉出三個黃金愛心 SC 有特別獎勵。</span></div>
  </div><h3 style="font-size:18px">卡片</h3><div class="rules">${Object.values(CARDS).map(c=>`<div><span class="ic" style="background:${c.c}">${c.ic}</span><span><b>${c.name}</b>　${c.vals ? c.desc("<i>"+c.vals.join("/")+"</i>") : c.desc()}<br><span class="muted" style="font-size:12px">${c.when}</span></span></div>`).join("")}</div>`;
}
$("#rulesBtn").onclick = () => { const p = openSheet(rulesHTML() + `<button class="btn" id="ok">知道了</button>`); p.querySelector("#ok").onclick = closeSheet; };
$("#again").onclick = startGame; $("#again2").onclick = startGame;
$("#toLetter").onclick = () => { $("#paper").innerHTML = CONFIG.letter.map((t,i)=>`<p style="animation-delay:${i*.5}s">${t}</p>`).join("") + `<p class="sign" style="animation-delay:${CONFIG.letter.length*.5}s">${CONFIG.herSign}</p>`; show("letter"); };
$("#toCard").onclick = async () => { show("card"); await buildPostcard(); };

/* ---------- postcard ---------- */
function svgImg(svg){ return new Promise((res,rej)=>{ const im = new Image(); im.onload=()=>res(im); im.onerror=rej; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }); }
function heartPath(x, cx, cy, s){ x.beginPath(); x.moveTo(cx, cy+s*.42); x.bezierCurveTo(cx-s*.62, cy, cx-s*.5, cy-s*.48, cx, cy-s*.2); x.bezierCurveTo(cx+s*.5, cy-s*.48, cx+s*.62, cy, cx, cy+s*.42); x.fill(); }
function rr(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.fill(); }
let pcCanvas = null;
async function buildPostcard(){
  try { await Promise.all([document.fonts.load('60px "Huninn"'), document.fonts.load('700 100px "Noto Serif TC"')]); } catch(e){}
  const W=1800, H=1200, cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x = cv.getContext("2d");
  x.fillStyle = "#E4E0D8"; x.fillRect(0,0,W,H);
  x.strokeStyle = "#CFC8BE"; x.lineWidth = 3; x.strokeRect(50,50,W-100,H-100);
  const cell = Math.floor(Math.min(760/COLS, 940/ROWS)), gap = 10, bw = COLS*cell, bh = ROWS*cell, bx = W-140-bw, by = (H-bh)/2;
  x.fillStyle = "#EFEBE5"; rr(x, bx-22, by-22, bw+44, bh+44, 30);
  G.cells.forEach((c,i) => {
    const cx = bx + (i%COLS)*cell, cy = by + Math.floor(i/COLS)*cell;
    x.fillStyle = c.o==="stone" ? "#ABA49B" : c.o===0 ? COLORS[0] : c.o===1 ? COLORS[1] : "#F7F4EF";
    rr(x, cx+gap/2, cy+gap/2, cell-gap, cell-gap, 14);
    if (c.o===0 || c.o===1){ x.fillStyle = "rgba(247,244,239,.92)"; heartPath(x, cx+cell/2, cy+cell/2+2, cell*.5); }
  });
  x.fillStyle = "#4A4E58"; x.textBaseline = "alphabetic";
  x.font = '700 116px "Noto Serif TC","Songti TC",serif'; x.fillText("一週年快樂", 130, 300);
  x.font = '56px "Huninn","PingFang TC",sans-serif'; x.fillText(`${nm(0)} ＆ ${nm(1)}`, 134, 410);
  x.fillStyle = "#80838B"; x.font = '38px "Huninn","PingFang TC",sans-serif'; x.fillText(`${CONFIG.startDate} — ${CONFIG.endDate}`, 134, 478);
  x.fillStyle = "#4A4E58"; x.font = '42px "Huninn","PingFang TC",sans-serif';
  let cur = "", ly = 600; const maxW = bx-134-80;
  for (const ch of CONFIG.postcardLine){ if (x.measureText(cur+ch).width > maxW){ x.fillText(cur,134,ly); cur = ch; ly += 62; } else cur += ch; }
  if (cur) x.fillText(cur,134,ly);
  x.fillStyle = "#80838B"; x.font = '32px "Huninn","PingFang TC",sans-serif'; x.fillText("我們一起圈出來的愛心", 134, ly+80);
  try { const a = await svgImg(svgSprout(0,200)); x.drawImage(a, 130, 830, 200, 220); const b = await svgImg(svgSprout(1,200)); x.drawImage(b, 340, 830, 200, 220); } catch(e){}
  if (G.egg){
    x.save(); x.translate(bx+bw-30, by-10); x.rotate(-.18);
    x.fillStyle = "#C9AE6A"; x.beginPath(); x.arc(0,0,92,0,Math.PI*2); x.fill();
    x.strokeStyle = "#F7F4EF"; x.lineWidth = 5; x.beginPath(); x.arc(0,0,78,0,Math.PI*2); x.stroke();
    x.fillStyle = "#F7F4EF"; x.textAlign = "center"; x.font = '700 40px "Noto Serif TC",serif'; x.fillText("彩蛋", 0, -4);
    x.font = '28px "Huninn","PingFang TC",sans-serif'; x.fillText("滿滿的愛", 0, 38); x.restore(); x.textAlign = "left";
  }
  pcCanvas = cv; $("#pc").src = cv.toDataURL("image/jpeg", .92);
}
/* ---------- fit board to screen ---------- */
function fitBoard(){
  const wrap = document.querySelector("#game .boardwrap"), b = $("#board");
  if (!wrap || !$("#game").classList.contains("on")) return;
  b.style.width = "100%";
  const w = wrap.clientWidth, h = wrap.clientHeight, pad = 14, gap = 5;
  const cell = Math.max(24, Math.min((w - pad - gap*(COLS-1))/COLS, (h - pad - gap*(ROWS-1))/ROWS));
  b.style.width = Math.floor(cell*COLS + gap*(COLS-1) + pad) + "px";
}
addEventListener("resize", fitBoard);
if (window.visualViewport) visualViewport.addEventListener("resize", fitBoard);
new MutationObserver(() => requestAnimationFrame(fitBoard)).observe($("#game"), {attributes:true, attributeFilter:["class"]});

/* ---------- start ---------- */
buildAmbient();
$("#introArt").innerHTML = `<div class="row" style="align-items:flex-end"><span class="bob">${svgSprout(0,90)}</span><span class="bob">${svgSprout(1,90)}</span></div>`;
$("#passHint").textContent = CONFIG.passHint;
function tryPass(){
  if ($("#pass").value.trim()===CONFIG.passcode){ const [x,y] = centerOf($("#go")); burst(x,y,{n:24,spread:140}); setTimeout(startGame, 350); }
  else { $("#passErr").textContent = "不是這天喔，再想想"; animate($("#pass"), [{transform:"translateX(0)"},{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}], {duration:350}); }
}
$("#go").onclick = tryPass;
$("#pass").addEventListener("keydown", e => { if (e.key==="Enter") tryPass(); });
</script>
